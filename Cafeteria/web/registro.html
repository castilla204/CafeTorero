<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register</title>
  <link rel="stylesheet" href="css/registro.css">
</head>
<body>

  <div class="contenedor">
    <div class="izquierda">
      <h2 class="titulo">SIGN UP</h2>
      <form>
        <label for="usuario" id="formularioregistro">User</label>
        <input type="text" id="usuario" name="usuario" required>
        <label for="correo">E-mail</label>
        <input type="email" id="email" name="email" required>
        <label for="contraseña">Password</label>
        <input type="password" id="contrasena" name="contraseña" required>
        <label for="ciudad">City</label>
        <input type="text" id="ciudad" name="ciudad" required>
        <label for="direccion">Address</label>
        <input type="text" id="direccion" name="direccion" required>
        <button type="submit" class="boton1" id="botonregistro" ><b><a href="logueados.html">Welcome</a></b></button>
      </form>
    </div>
    <div class="derecha">
      <img src="IMG/fondologin6.jpg" alt="Logo" class="logo">
    </div>
  </div>
</body>
</html>
